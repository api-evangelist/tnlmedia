name: TNL Mediagene
description: >-
  TNL Mediagene is a next-generation digital and technology media group serving
  millennial and Gen Z audiences across Asia. Formed from the 2023 merger of
  Taiwan's The News Lens and Japan's Mediagene, the group operates more than
  twenty media brands spanning news, business, technology, lifestyle, and sports
  — including The News Lens, INSIDE, Cool3c, Gizmodo Japan, Business Insider
  Japan, Lifehacker Japan, Roomie, and licensed titles such as Digiday Japan and
  Glossy Japan. Beyond publishing, the company runs advertising and marketing
  technology (the Ad2iction DSP), an AI-driven customer data and audience
  analytics platform, e-commerce properties, and market-research services. It is
  a portfolio company of 500 Global. No public developer or API surface is
  published at this time.
