apis:
- name: Ad2iction Prebid Bid Endpoint
  description: >-
    The header-bidding demand endpoint operated by Ad2iction, TNL Mediagene's
    ad-technology subsidiary (acquired by TNL Media Group in 2020). Publishers
    reach it through the `ad2iction` bidder adapter shipped in Prebid.js: the
    adapter POSTs an application/json body carrying `ids` (a JSON array of
    {bannerId, bidId} pairs, one per ad unit), the OpenRTB 2.x `ortb2` first-party
    data object, Prebid `refererInfo`, an adapter version constant `v` (currently
    3), a `udid` read from the first-party ad2udid cookie, and a cache-busting
    timestamp. The response is a bare JSON array of Prebid bid responses. Banner
    is the only supported media type; there is no Prebid Server adapter. The call
    is unauthenticated but placement-gated — the required `id` bid parameter is an
    Ad2iction-issued placement identifier obtained by contacting the company, and
    there is no self-service signup.
  humanURL: https://docs.prebid.org/dev-docs/bidders/ad2iction.html
  baseURL: https://ads.ad2iction.com/html/prebid/
